<style>

  body.chatting .stage{padding-top:5vh}

  /* ---------- rosto ---------- */
  .face{width:132px;height:132px;transition:width .6s ease,height .6s ease;cursor:pointer}
  body.chatting .face{width:84px;height:84px}
  .face .head{fill:none;stroke:var(--fg);stroke-width:3}
  .face .eye{fill:var(--fg);transform-box:fill-box;transform-origin:center;transition:transform .12s ease}
  .face.blink .eye{transform:scaleY(.08)}
  .face .mouth{fill:none;stroke:var(--fg);stroke-width:3;stroke-linecap:round;transition:d .3s ease}
  .face.thinking .eye{transform:scaleY(.55)}
  .face.talking .mouth{animation:talk .22s ease-in-out infinite alternate}
  @keyframes talk{from{d:path("M46 80 Q60 86 74 80")}to{d:path("M48 79 Q60 92 72 79")}}

  .role{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--dim);letter-spacing:.5px}
  body.chatting .name,body.chatting .role{display:none}

  /* ---------- conversa ---------- */
  .thread{width:100%;margin-top:28px;display:flex;flex-direction:column;gap:22px;padding-bottom:200px}
  .q{align-self:flex-end;max-width:85%;color:var(--dim);font-size:14px;text-align:right}

  .a .tag{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--dim)}
  .cursor{display:inline-block;width:7px;height:15px;background:var(--fg);vertical-align:-2px;margin-left:2px;animation:bl 1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}

  /* ---------- busca ---------- */
  .dock{width:100%;max-width:680px;padding:0 20px;transition:all .6s ease}
  body:not(.chatting) .dock{margin-top:40px}
  body.chatting .dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);padding-bottom:20px;padding-top:30px;background:linear-gradient(transparent,#000 35%)}
  form{display:flex;align-items:center;gap:10px;border:1px solid var(--faint);border-radius:999px;padding:6px 6px 6px 20px;background:#0a0a0a;transition:border-color .2s}
  form:focus-within{border-color:#5a5a5a}
  input{flex:1;background:none;border:0;outline:0;color:var(--fg);font:inherit;font-size:15px;padding:10px 0;min-width:0}

const norm = s => " " + s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9&\s]/g," ").replace(/\s+/g," ") + " ";

function findAnswer(q){
  const t = norm(q);
  let best=null, score=0;
  for(const item of KB){
    let s=0;
    for(const k of item.k){
      const nk = norm(k).trim();
      if(!nk) continue;
      const short = nk.length <= 3;               // palavras curtas só valem inteiras
      const hit = short ? t.includes(" "+nk+" ") : t.includes(nk);
      if(hit) s += nk.includes(" ") ? 3 : (nk.length > 5 ? 2 : 1);
    }
    if(s>score){score=s;best=item;}
  }
  if(best) return { html:best.a, id:best.id };
  return { id:null, html:`<p>Essa eu ainda não respondo por aqui, mas posso te contar na conversa. Me chama no ${L.linkedin}.</p>
     <p>Por aqui, posso falar dos meus projetos, das ferramentas que uso, do RAG da LGPD ou da minha trajetória.</p>` };
}

/* ---------- rosto: olhar, piscar, pensar, falar ---------- */
const face = document.getElementById("face"), eyes = document.getElementById("eyes");
function look(x,y){
  const r = face.getBoundingClientRect();
  const dx = x-(r.left+r.width/2), dy = y-(r.top+r.height/2);
  const d = Math.hypot(dx,dy)||1, m = Math.min(5, d/40);
  eyes.setAttribute("transform",`translate(${(dx/d*m).toFixed(2)} ${(dy/d*m).toFixed(2)})`);
}
addEventListener("pointermove",e=>look(e.clientX,e.clientY));
function blink(){ face.classList.add("blink"); setTimeout(()=>face.classList.remove("blink"),130); }
(function loop(){ setTimeout(()=>{ blink(); loop(); }, 2600+Math.random()*3200); })();

let busy=false; const asked=new Set();

    const b=document.createElement("button"); b.className="chip"; b.type="button"; b.textContent=c;
    b.onclick=()=>ask(c); chips.appendChild(b);
  });
}
renderChips(CHIPS);

input.addEventListener("input",()=>send.disabled=!input.value.trim()||busy);
form.addEventListener("submit",e=>{e.preventDefault(); if(input.value.trim()) ask(input.value.trim());});
addEventListener("keydown",e=>{
  if(e.key==="/" && document.activeElement!==input){ e.preventDefault(); input.focus(); }
  if(e.key==="Escape" && document.body.classList.contains("chatting")) reset();
});

function reset(){
  if(busy) return;
  thread.innerHTML=""; asked.clear();
  document.body.classList.remove("chatting");
  renderChips(CHIPS); scrollTo({top:0});
}
home.addEventListener("click",reset);
face.addEventListener("click",()=>{ blink(); });
face.addEventListener("keydown",e=>{ if(e.key==="Enter") reset(); });

const sleep = ms => new Promise(r=>setTimeout(r,ms));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

async function typeHTML(el, html){
  const tmp=document.createElement("div"); tmp.innerHTML=html;
  if(reduced){ el.innerHTML=html; return; }
  el.innerHTML=""; const cur=document.createElement("span"); cur.className="cursor";
  async function walk(src,dst){
    for(const node of [...src.childNodes]){
      if(node.nodeType===3){
        const txt=document.createTextNode(""); dst.appendChild(txt); dst.appendChild(cur);
        for(const w of node.textContent.split(/(\s+)/)){ txt.textContent+=w; if(w.trim()) await sleep(16); }
      }else{
        const clone=node.cloneNode(false); dst.appendChild(clone); await walk(node,clone);
      }
    }
  }
  await walk(tmp,el); cur.remove();
}

async function ask(q){
  if(busy) return; busy=true; asked.add(q);
  document.body.classList.add("chatting");
  input.value=""; send.disabled=true;
  const qe=document.createElement("div"); qe.className="q"; qe.textContent=q; thread.appendChild(qe);
  const ae=document.createElement("div"); ae.className="a"; ae.innerHTML='<span class="cursor"></span>'; thread.appendChild(ae);
  qe.scrollIntoView({behavior:reduced?"auto":"smooth",block:"start"});
  face.classList.add("thinking");
  await sleep(500+Math.random()*300);
  const ans = findAnswer(q);
  face.classList.remove("thinking"); face.classList.add("talking");
  await typeHTML(ae, ans.html);
  face.classList.remove("talking");
  renderChips([...(RELATED[ans.id]||[]), ...CHIPS]);
  busy=false; send.disabled=!input.value.trim();
  if(matchMedia("(pointer:fine)").matches) input.focus();
}

</script>
