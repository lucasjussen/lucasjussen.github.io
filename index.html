<style>
  :root{
    --bg:#000;
    --fg:#f2f2f0;
    --dim:#8a8a8a;
    --faint:#3a3a3a;
    --line:#1f1f1f;
    --accent:#7aa2ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;align-items:center;min-height:100%;overflow-x:hidden}

  main{width:100%;max-width:680px;padding:0 20px;display:flex;flex-direction:column;align-items:center;flex:1}
  body:not(.chatting){justify-content:center}
  body:not(.chatting) main{flex:0}
  body:not(.chatting) .thread{display:none}
  .stage{display:flex;flex-direction:column;align-items:center;justify-content:center;transition:padding .6s ease;padding-top:0}
  body.chatting .stage{padding-top:5vh}

  /* ---------- rosto ---------- */
  .face{width:132px;height:132px;transition:width .6s ease,height .6s ease;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent;user-select:none}
  body.chatting .face{width:84px;height:84px}
  .face .head{fill:none;stroke:var(--fg);stroke-width:3}
  .face .eye{fill:var(--fg);transform-box:fill-box;transform-origin:center;transition:transform .12s ease}
  .face.blink .eye{transform:scaleY(.08)}
  .face .mouth{fill:none;stroke:var(--fg);stroke-width:3;stroke-linecap:round;transition:d .3s ease}
  .face.thinking .eye{transform:scaleY(.55)}
  .face.talking .mouth{animation:talk .22s ease-in-out infinite alternate}
  @keyframes talk{from{d:path("M46 80 Q60 86 74 80")}to{d:path("M48 79 Q60 92 72 79")}}

  .name{margin:22px 0 4px;font-size:15px;font-weight:600;letter-spacing:.2px}
  .role{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--dim);letter-spacing:.5px}
  body.chatting .name,body.chatting .role{display:none}

  /* ---------- conversa ---------- */
  .thread{width:100%;margin-top:28px;display:flex;flex-direction:column;gap:22px;padding-bottom:200px}
  .q{align-self:flex-end;max-width:85%;color:var(--dim);font-size:14px;text-align:right}
  .a{font-size:15.5px;line-height:1.65;color:var(--fg)}
  .a p{margin:0 0 10px}
  .a ul{margin:0 0 10px;padding-left:18px}
  .a li{margin:0 0 6px}
  .a b{font-weight:600}
  .a a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(122,162,255,.35)}
  .a a:hover{border-bottom-color:var(--accent)}
  .a .tag{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--dim)}
  .cursor{display:inline-block;width:7px;height:15px;background:var(--fg);vertical-align:-2px;margin-left:2px;animation:bl 1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}

  /* ---------- busca ---------- */
  .dock{width:100%;max-width:680px;padding:0 20px;transition:all .6s ease}
  body:not(.chatting) .dock{margin-top:40px}
  body.chatting .dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);padding-bottom:20px;padding-top:30px;background:linear-gradient(transparent,#000 35%)}
  form{display:flex;align-items:center;gap:10px;border:1px solid var(--faint);border-radius:999px;padding:6px 6px 6px 20px;background:#0a0a0a;transition:border-color .2s}
  form:focus-within{border-color:#5a5a5a}
  input{flex:1;background:none;border:0;outline:0;color:var(--fg);font:inherit;font-size:15px;padding:10px 0;min-width:0}
  input::placeholder{color:#5f5f5f}
  button.send{width:40px;height:40px;border-radius:50%;border:0;background:var(--fg);color:#000;display:grid;place-items:center;cursor:pointer;flex-shrink:0;transition:opacity .2s}
  button.send:disabled{opacity:.25;cursor:default}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
  body.chatting .chips{justify-content:flex-start;margin-top:10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)}
  body.chatting .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;flex-shrink:0}
  .chip{font-family:inherit;font-size:13px;color:var(--dim);background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;transition:all .2s}
  .chip:hover{color:var(--fg);border-color:var(--faint)}

  .note{text-align:center;margin-top:14px;font-family:"JetBrains Mono",monospace;font-size:11px;color:#4a4a4a}
  body.chatting .note{display:none}
  .face:focus,.face:focus-visible{outline:none}
  .home{display:none;font-family:"JetBrains Mono",monospace;font-size:11px;color:#5f5f5f;background:none;border:0;cursor:pointer;margin-top:10px;padding:6px}
  body.chatting .home{display:block}
  .home:hover{color:var(--fg)}
  .wa{position:fixed;right:22px;bottom:22px;z-index:20;width:56px;height:56px;border-radius:50%;background:#25d366;display:grid;place-items:center;text-decoration:none;box-shadow:0 6px 22px rgba(37,211,102,.28),0 2px 8px rgba(0,0,0,.6);transition:transform .2s ease,box-shadow .2s ease}
  .wa:hover{transform:scale(1.07);box-shadow:0 8px 28px rgba(37,211,102,.4),0 2px 8px rgba(0,0,0,.6)}
  .wa::after{content:"Falar no WhatsApp";position:absolute;right:66px;white-space:nowrap;font-size:12.5px;font-weight:500;color:var(--fg);background:#111;border:1px solid var(--faint);border-radius:8px;padding:6px 10px;opacity:0;pointer-events:none;transform:translateX(6px);transition:opacity .2s,transform .2s}
  .wa:hover::after{opacity:1;transform:none}
  @media (max-width:820px){ .wa{right:16px;bottom:18px;width:52px;height:52px} .wa::after{display:none} body.chatting .wa{bottom:158px} }
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
  .btn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;text-decoration:none;border-radius:999px;padding:10px 18px;transition:all .2s;border-bottom:0!important}
  .btn.primary{background:var(--fg);color:#000!important}
  .btn.primary:hover{opacity:.85}
  .btn.ghost{border:1px solid var(--faint)!important;color:var(--fg)!important}
  .btn.ghost:hover{border-color:#25d366!important}
  .chip.cv{color:var(--fg);border-color:var(--faint)}
  .cv-card{display:flex;gap:16px;align-items:stretch;max-width:430px;margin:6px 0 4px;padding:12px;border:1px solid var(--faint);border-radius:16px;background:#0a0a0a}
  .a a.cv-thumb{display:block;flex:0 0 112px;border:0;line-height:0}
  .cv-thumb img{width:112px;height:auto;border-radius:6px;border:1px solid #262626;display:block;transition:opacity .2s}
  .cv-thumb:hover img{opacity:.85}
  .cv-info{display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-width:0}
  .cv-title{font-weight:600;font-size:15px;line-height:1.3}
  .cv-meta{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--dim);margin-top:4px}
  .cv-card .actions{margin:0}
  .cv-card .btn{padding:8px 14px;font-size:13px}
  @media (max-width:480px){ .cv-card{gap:12px} .a a.cv-thumb{flex-basis:84px} .cv-thumb img{width:84px} .cv-card .btn{padding:8px 12px} }
  footer{width:100%;max-width:680px;padding:28px 20px 28px;display:flex;justify-content:center;gap:12px}
  footer a{color:#5f5f5f;text-decoration:none;transition:color .2s,transform .2s;width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
  footer a svg{width:20px;height:20px;display:block}
  footer a:hover{color:var(--fg);transform:translateY(-2px)}
  body.chatting footer{display:none}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  { id:"oi", k:["oi","ola","bom dia","boa tarde","boa noite","e ai","hello","hi"],
    a:`<p>Oi! Sou o Lucas. Pode perguntar sobre meus projetos, as ferramentas que uso ou como falar comigo.</p>` },

  { id:"obrigado", k:["obrigad","valeu","agradec","show","legal","massa","top"],

  { id:"sobre", k:["quem","sobre voce","se apresent","apresentacao","resumo","quem e","fale de voce","fala de voce","o que voce faz"],
    a:`<p>Sou o Lucas, analista de IA e automação em Curitiba. Pego rotinas manuais, entendo como elas funcionam de verdade e transformo em fluxos que rodam sozinhos, deixando a pessoa só onde o julgamento humano faz diferença.</p>
       <p>No último emprego fui o único responsável por IA e automação da empresa e coloquei <b>15 automações e sistemas internos em produção</b>, usados por RH, jurídico, operacional, comercial, marketing e TI.</p>` },

  { id:"projetos", k:["automatiz","projeto","fez","criou","construiu","exemplo","producao","entreg","resultado","ganho","portfolio","trabalhos"],
    a:`<p>Alguns dos que mais geraram resultado:</p>

         <li><b>Conferência documental com IA</b>: lê e-mails, extrai os PDFs e confere os valores com a API do Claude. Devolveu cerca de <b>3 dias de trabalho por ciclo</b> ao jurídico.</li>

       <p>Pergunte sobre qualquer um deles.</p>` },

  { id:"conferencia", k:["conferencia","document","pdf","valores","financeir","claude api","3 dias","tres dias"],
    a:`<p>O jurídico conferia valores de documentos financeiros na mão. Montei um fluxo que lê a caixa de e-mail via Microsoft Graph, extrai os PDFs, manda para a API do Claude conferir e registra cada caso no CRM.</p>
       <p>Casos conformes seguem sozinhos; divergentes vão para validação humana. Um detalhe técnico: o conector nativo de e-mail tinha uma limitação, então chamei a API diretamente.</p>
       <p>Resultado: <b>cerca de 3 dias de trabalho devolvidos por ciclo</b>.</p>
       <p class="tag">n8n · Microsoft Graph · Claude API · Bitrix24</p>` },

  { id:"rag", k:["rag","lgpd","eval","avalia","vetor","embedding","pgvector","ollama","busca semantica"],
    a:`<p>Construí um assistente que responde dúvidas sobre a <b>LGPD</b> apenas com base no texto oficial da lei, citando o artigo, e recusa o que está fora do escopo.</p>
       <p>O que mais me ensinou foi medir: criei um <b>eval automatizado de 10 casos</b> (10/10). E mesmo com nota máxima, ele revelou quando o agente respondia sem consultar a base, um problema que a nota sozinha escondia.</p>
       <p class="tag">n8n · Ollama · PostgreSQL/pgvector · Docker · Claude</p>

  { id:"agentes", k:["agente","agent","llm","ia generativa","prompt","modelo de linguagem","inteligencia artificial"],
    a:`<p>Uso IA generativa todos os dias, tanto para desenvolver quanto dentro das soluções. Trabalho principalmente com a API do Claude: engenharia de prompt com papéis definidos, dados delimitados por tags XML e saída estruturada em JSON.</p>
       <p>Já construí agentes com ferramentas e RAG, e gosto de colocar <b>validação humana</b> onde o erro custa caro. Também meço a qualidade com evals, em vez de confiar no "parece bom".</p>` },

       <p>Para evitar a API paga do sistema de ponto, usei Google Sheets como fonte de dados. O RH deixou de fazer conferência manual.</p>` },

  { id:"bot", k:["bot","chamado","suporte","helpdesk","ticket"],

  projetos:["Conta da conferência documental","Como foi o banco de horas?","E o bot de chamados?"],
  conferencia:["Como foi o banco de horas?","Me fala do RAG da LGPD"],

const norm = s => " " + s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9&\s]/g," ").replace(/\s+/g," ") + " ";

function findAnswer(q){
  const t = norm(q);
  let best=null, score=0;
  for(const item of KB){
    let s=0;
    for(const k of item.k){
      const nk = norm(k).trim();
      if(!nk) continue;
      const short = nk.length <= 3;               // palavras curtas só valem inteiras
      const hit = short ? t.includes(" "+nk+" ") : t.includes(nk);
      if(hit) s += nk.includes(" ") ? 3 : (nk.length > 5 ? 2 : 1);
    }
    if(s>score){score=s;best=item;}
  }
  if(best) return { html:best.a, id:best.id };
  return { id:null, html:`<p>Essa eu ainda não respondo por aqui, mas posso te contar na conversa. Me chama no ${L.wa} ou no ${L.linkedin}.</p>
     <p>Por aqui, posso falar dos meus projetos, das ferramentas que uso, do RAG da LGPD ou da minha trajetória.</p>` };
}

/* ---------- rosto: olhar, piscar, pensar, falar ---------- */
const face = document.getElementById("face"), eyes = document.getElementById("eyes");
function look(x,y){
  const r = face.getBoundingClientRect();
  const dx = x-(r.left+r.width/2), dy = y-(r.top+r.height/2);
  const d = Math.hypot(dx,dy)||1, m = Math.min(5, d/40);
  eyes.setAttribute("transform",`translate(${(dx/d*m).toFixed(2)} ${(dy/d*m).toFixed(2)})`);
}
addEventListener("pointermove",e=>look(e.clientX,e.clientY));
function blink(){ face.classList.add("blink"); setTimeout(()=>face.classList.remove("blink"),130); }
(function loop(){ setTimeout(()=>{ blink(); loop(); }, 2600+Math.random()*3200); })();

/* ---------- conversa ---------- */
const form=document.getElementById("ask"), input=document.getElementById("input"),
      send=document.getElementById("send"), thread=document.getElementById("thread"),
      chips=document.getElementById("chips"), home=document.getElementById("home");
let busy=false; const asked=new Set();

function renderChips(list){
  chips.innerHTML="";
  const CV="Ver currículo de Lucas";
  [CV, ...[...new Set(list)].filter(c=>c!==CV && !asked.has(c)).slice(0,4)].forEach(c=>{
    const b=document.createElement("button"); b.className="chip"+(c===CV?" cv":""); b.type="button"; b.textContent=c;
    b.onclick=()=>ask(c); chips.appendChild(b);
  });
}
renderChips(CHIPS);

input.addEventListener("input",()=>send.disabled=!input.value.trim()||busy);
form.addEventListener("submit",e=>{e.preventDefault(); if(input.value.trim()) ask(input.value.trim());});
addEventListener("keydown",e=>{
  if(e.key==="/" && document.activeElement!==input){ e.preventDefault(); input.focus(); }
  if(e.key==="Escape" && document.body.classList.contains("chatting")) reset();
});

function reset(){
  if(busy) return;
  thread.innerHTML=""; asked.clear();
  document.body.classList.remove("chatting");
  renderChips(CHIPS); scrollTo({top:0});
}
home.addEventListener("click",reset);
face.addEventListener("click",()=>{ blink(); });
face.addEventListener("keydown",e=>{ if(e.key==="Enter") reset(); });

const sleep = ms => new Promise(r=>setTimeout(r,ms));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

async function typeHTML(el, html){
  const tmp=document.createElement("div"); tmp.innerHTML=html;
  if(reduced){ el.innerHTML=html; return; }
  el.innerHTML=""; const cur=document.createElement("span"); cur.className="cursor";
  async function walk(src,dst){
    for(const node of [...src.childNodes]){
      if(node.nodeType===3){
        const txt=document.createTextNode(""); dst.appendChild(txt); dst.appendChild(cur);
        for(const w of node.textContent.split(/(\s+)/)){ txt.textContent+=w; if(w.trim()) await sleep(16); }
      }else{
        const clone=node.cloneNode(false); dst.appendChild(clone); await walk(node,clone);
      }
    }
  }
  await walk(tmp,el); cur.remove();
}

// Endereço do Worker (worker/chat-worker.js). Vazio = usa só as respostas escritas à mão.
const CHAT_ENDPOINT = "https://chat-portfolio.lucasjussen.workers.dev/";
const history = [];

// Pede a resposta à IA; se falhar ou não houver endpoint, devolve null e o site usa o KB.
async function askAI(q){
  if(!CHAT_ENDPOINT) return null;
  try{
    const r = await fetch(CHAT_ENDPOINT,{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ question:q, history: history.slice(-6) })
    });
    if(!r.ok) return null;
    const data = await r.json();
    return data.answer ? { answer: data.answer, sources: Array.isArray(data.sources) ? data.sources : [] } : null;
  }catch(e){ return null; }
}

const CV_CHIP = "Ver currículo de Lucas";
function wantsCV(q){
  if(q===CV_CHIP) return true;
  const t = norm(q).trim();
  if(["curriculo","cv","seu curriculo","curriculo pdf"].includes(t)) return true;
  return /\b(ver|vejo|mand\w*|envi\w*|baix\w*|pass\w*|quero|tem)\b.*\b(curriculo|cv)\b/.test(t) && t.split(" ").length <= 8;
}
const esc = t => t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const CV_HTML = `<p>Aqui está o currículo do Lucas.</p>
  <div class="cv-card">
    <a class="cv-thumb" href="curriculo.pdf" target="_blank" rel="noopener" aria-label="Abrir o currículo em PDF"><img src="curriculo-preview.jpg" alt="Primeira página do currículo de Lucas Jussen" width="112" loading="lazy"></a>
    <div class="cv-info">
      <div><div class="cv-title">Currículo · Lucas Jussen</div><div class="cv-meta">PDF · 1 página</div></div>
      <div class="actions"><a class="btn primary" href="curriculo.pdf" target="_blank" rel="noopener">Abrir</a><a class="btn ghost" href="curriculo.pdf" download="Curriculo-Lucas-Jussen.pdf">Baixar</a></div>
    </div>
  </div>`;

async function ask(q){
  if(busy) return; busy=true; asked.add(q);
  document.body.classList.add("chatting");
  input.value=""; send.disabled=true;
  const qe=document.createElement("div"); qe.className="q"; qe.textContent=q; thread.appendChild(qe);
  const ae=document.createElement("div"); ae.className="a"; ae.innerHTML='<span class="cursor"></span>'; thread.appendChild(ae);
  qe.scrollIntoView({behavior:reduced?"auto":"smooth",block:"start"});
  face.classList.add("thinking");
  let html, chips;
  if(wantsCV(q)){
    await sleep(350);
    html = CV_HTML; chips = CHIPS;
    history.push({role:"user",content:q},{role:"assistant",content:"Enviei o currículo em PDF aqui na conversa."});
  }else{
  const ai = await askAI(q);
  await sleep(300+Math.random()*250);
  if(ai){
    const tag = ai.sources.length ? `Gerada por IA · baseado em: ${esc(ai.sources.join(", "))}` : "Resposta gerada por IA a partir das informações que eu escrevi";
    html = `<p>${esc(ai.answer).replace(/\n+/g,"</p><p>")}</p>
            <p class="tag">${tag}</p>`;
    chips = CHIPS;
    history.push({role:"user",content:q},{role:"assistant",content:ai.answer});
  }else{
    const ans = findAnswer(q);
    html = ans.html;
    chips = [...(RELATED[ans.id]||[]), ...CHIPS];
  }
  }
  face.classList.remove("thinking"); face.classList.add("talking");
  await typeHTML(ae, html);
  face.classList.remove("talking");
  renderChips(chips);
  busy=false; send.disabled=!input.value.trim();
  if(matchMedia("(pointer:fine)").matches) input.focus();
}
